<!DOCTYPE html>
<html>
<head>
    <title>QuickSpot Parking</title>
    <meta http-equiv="refresh" content="5">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        .car-icon {
            fill: currentColor;  /* This makes SVG follow text color */
            padding: 10px; 
        }  
        .spot{
            font-size: 40px;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }
        .available{
            color: green;
        }
        .occupied{
            color: red;
        }
        .lot-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* 5 spots per row */
            gap: 20px;
            width: 60%;
            margin: 40px auto;
        }
    </style>
</head>
